name: PacketLens verification
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: evidence/test-results.json
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev
      - run: python -m pip install -r requirements.txt
      - run: sudo "$(which python)" scripts/live_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-live-capture
          path: |
            evidence/live-results.json
            evidence/live-loopback.pcap
